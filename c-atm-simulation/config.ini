# ==============================================================================
# c-atm-simulation configuration file (Section 3)
# Key = Value format, # denotes comment lines.
# ==============================================================================

# General UI
currency = $

# Cash Withdrawal Rules
withdraw_multiple = 100
per_withdraw_limit = 20000
daily_withdraw_limit = 50000

# Security & PIN
max_pin_tries = 3
pin_hash_iterations = 10000

# OTP Rules (F1)
otp_ttl_s = 120
otp_max_tries = 3
otp_resend_max = 2
otp_resend_gap_s = 30
otp_transfer_threshold = 10000

# Fraud Detection Risk Thresholds (F2)
fraud_warn = 40
fraud_stepup = 70
fraud_freeze = 90

# Administrative Limits
admin_max_tries = 3

# Loans Rules (F5)
loan_cap = 100000
loan_dual_approval_limit = 50000
loan_max_active = 2
loan_min_account_age_days = 30
late_fee_pct = 2

# Savings Interest (F9)
savings_rate_pct = 4

# Vouchers (F6)
voucher_bad_tries = 5

# Network Daemon (F8)
server_bind = 127.0.0.1
server_port = 5050
server_max_clients = 8
session_idle_s = 120
